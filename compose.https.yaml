services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST to your domain}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
volumes:
  caddy-data:
  caddy-config:
